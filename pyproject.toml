[project]
name = "giraf"
version = "0.1.0"
description = "Local IRAF workflow workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "pillow>=12.3.0",
    "pexpect>=4.9,<5",
    "pydantic>=2.12,<3",
    "pyraf>=2.2.4",
    "giraf-pyraf-compat; sys_platform == 'darwin'",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
    "send2trash>=1.8.3",
]

[tool.uv.sources]
giraf-pyraf-compat = { path = "compat/pyraf-tk" }
