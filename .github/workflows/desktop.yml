# Builds the desktop app on every push to main and publishes it as a release.
name: Desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pyraf ships only as source and builds its X11 helper on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - run: bun install --frozen-lockfile
      # Each release has a higher version, so installed apps see it as an update.
      - run: npm pkg set version=0.1.${{ github.run_number }}
      - run: node scripts/stage.mjs
      - run: bunx electron-builder ${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Installed Linux apps update from latest-linux.yml.
      - if: runner.os == 'Linux'
        run: test -f dist/latest-linux.yml

      - uses: actions/upload-artifact@v4
        with:
          name: giraf-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap

      # The Windows app runs this Linux backend in WSL.
      - if: runner.os == 'Linux'
        run: bun run wsl-archive
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wsl-backend
          retention-days: 1
          if-no-files-found: error
          path: desktop/build/giraf-linux.tar.gz

  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wsl-backend
          path: desktop/build/wsl
      - run: bun install --frozen-lockfile
      - run: npm pkg set version=0.1.${{ github.run_number }}
      - run: bunx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: giraf-Windows
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: giraf-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          short="${GITHUB_SHA::7}"
          # Installed Windows and Linux apps update from latest*.yml in the
          # latest release (see desktop/package.json build.publish).
          test -f dist/latest.yml && test -f dist/latest-linux.yml
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GIRAF 0.1.${GITHUB_RUN_NUMBER} (${short})" \
            --notes "${MESSAGE:-$short}"
