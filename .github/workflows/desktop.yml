# Builds the desktop app on every push to main and publishes it as a release.
name: Desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push releases only when RELEASE_NOTES.md holds new update notes, i.e.
  # differs from the latest release (docs/releases.md). Manual runs always do.
  notes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published="$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(cat RELEASE_NOTES.md)" != "$published" ]; then
            echo release=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RELEASE_NOTES.md is unchanged since the latest release; skipping the build."
            echo release=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: notes
    if: needs.notes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pyraf ships only as source and builds its X11 helper on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - run: bun install --frozen-lockfile
      # Each release has a higher version, so installed apps see it as an update.
      - run: npm pkg set version=0.1.${{ github.run_number }}
      - run: node scripts/stage.mjs
      # macOS signs with the Developer ID certificate from a keychain set up
      # here (electron-builder's own temporary keychain fails to unlock on
      # the runners) and notarizes. Without the secret the app is unsigned
      # and cannot update itself.
      - name: Import signing certificate
        if: runner.os == 'macOS'
        id: keychain
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then
            echo "::warning::MAC_CERTIFICATE secret is not set; building an unsigned Mac app."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in MAC_CERTIFICATE."; exit 1; }
          echo signed=true >> "$GITHUB_OUTPUT"
      # The Mac icon is an Icon Composer file, which needs actool from Xcode 26+.
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.keychain.outputs.signed == 'true' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args="${{ matrix.platform }}"
          if [ "$RUNNER_OS" = macOS ] && [ "$CSC_IDENTITY_AUTO_DISCOVERY" != true ]; then
            args="$args -c.mac.identity=null -c.mac.notarize=false"
          fi
          bunx electron-builder $args --publish never
      # Installed apps update from latest-mac.yml / latest-linux.yml.
      - run: test -f dist/latest-mac.yml || test -f dist/latest-linux.yml

      - uses: actions/upload-artifact@v4
        with:
          name: giraf-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap

      # The Windows app runs this Linux backend in WSL.
      - if: runner.os == 'Linux'
        run: bun run wsl-archive
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wsl-backend
          retention-days: 1
          if-no-files-found: error
          path: desktop/build/giraf-linux.tar.gz

  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wsl-backend
          path: desktop/build/wsl
      - run: bun install --frozen-lockfile
      - run: npm pkg set version=0.1.${{ github.run_number }}
      - run: bunx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: giraf-Windows
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: giraf-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Installed apps update from latest*.yml in the latest release
          # (see desktop/package.json build.publish).
          test -f dist/latest.yml && test -f dist/latest-mac.yml && test -f dist/latest-linux.yml
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GIRAF 0.1.${GITHUB_RUN_NUMBER}" \
            --notes-file RELEASE_NOTES.md
